<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; connect-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Take a Meep</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="bird-stage" aria-label="Take a Meep">
        <div class="ground-shadow" aria-hidden="true"></div>
        <canvas id="birdCanvas" role="button" tabindex="0"></canvas>
        <div id="timerChip" class="timer-chip">
          <div class="chip-controls">
            <button id="chipPause" class="chip-button" type="button">⏸</button>
            <button id="chipReset" class="chip-button" type="button">↺</button>
            <button id="chipStop" class="chip-button" type="button">■</button>
          </div>
          <span class="chip-pulse" aria-hidden="true"></span>
          <strong id="chipTime">30:00</strong>
          <span id="chipLabel" class="chip-phase">Focus</span>
          <button id="chipMeep" class="chip-button chip-meep" type="button" aria-label="Meep!">
            <svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true">
              <circle cx="13.2" cy="7.6" r="4.8" fill="currentColor"/>
              <path d="M9.6 6.9 L0.8 10.4 L9.8 10.6 Z" fill="currentColor"/>
              <circle cx="14.6" cy="6.1" r="1.15" fill="#1d1a18"/>
            </svg>
          </button>
        </div>
        <div id="alarmCaption" class="alarm-caption" aria-hidden="true"><span>MEEP</span><span>MEEP!</span></div>
        <div id="idleHint" class="idle-hint">Double-click to start · settings in the menu bar</div>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
